# GitCrawl configuration: models, budgets, pacing, GitHub access and caching.
#
# The rubric — pillars, weights, criteria, score bands, hard rules — is NOT
# configured here. It comes from clause.md (bundled default:
# src/gitcrawl/defaults/clause.md) and the approved plan generated from it.

# Provider notes (all confirmed empirically):
#
#   google — gemini-3.5-flash-lite, no-card free tier. Validated on tool use +
#     structured output together. Current default for this reason.
#
#   mistral — this account's tier 403s on mistral-large-latest and gates
#     small/medium at 0 requests/minute (needs paid pay-as-you-go, which asks
#     for a card). ministral-8b-latest works but its structured output is
#     unreliable on real schemas; fine as a fallback, not for complete reports.
#
#   groq — genuinely no-card free tier and worked end-to-end, but the daily
#     token quota (200k/day) is easy to exhaust. gpt-oss rejects JSON mode
#     combined with tool calling, which is why judgement agents set parser_model.
#
# Swapping providers needs no code change (see agents/model_factory.py).
# Model ids are part of every cached model output's key: changing one re-runs
# only that stage (facts stay cached).
[models]
provider = "google"
investigator = "gemini-3.5-flash-lite"   # judgement agents
scorer = "gemini-3.5-flash-lite"         # pillar scorers
planner = "gemini-3.5-flash-lite"        # clause.md -> plan (one call per rubric)

[budget]
max_file_bytes = 100_000      # per-file read cap, for collectors and agent tools
shortlist_size = 40           # max paths returned by list_directory "."

# Free tiers have tiny per-minute limits; several agents at once 429s every one.
[concurrency]
max_concurrent_agent_calls = 1
max_retries_on_rate_limit = 8
retry_base_delay_seconds = 8.0

# Model requests per minute, per provider — requests are spaced to stay under
# free-tier limits instead of hitting 429s (see agents/limiter.py).
[rate_limits.requests_per_minute]
google = 10
groq = 20
mistral = 30

# Tool-call budget for each judgement agent, by evidence domain. Agents are
# grouped by the kind of evidence they need (see plan/agents.py).
[agents.budgets]
source_code = 30
tests = 8
ci = 6
issues_prs = 6
docs_community = 4

# GitHub API access. The token is read from GITHUB_TOKEN (or GH_TOKEN) in
# .env — a free, read-only fine-grained token is enough for public repos.
[github]
snapshot_ttl_hours = 24        # API facts (issues, PRs, CI runs) re-fetched after this
timeout_seconds = 20.0
max_retries = 3

[api_windows]                  # bounded windows — never enumerate full history
recent_prs = 50
recent_issues = 50
oldest_open_issues = 25
recent_releases = 10
recent_workflow_runs = 50

[cache]
clone_ttl_hours = 24
